<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Finance Guy — Tweet Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #00e5a0;
    --accent2: #005eff;
    --text: #f0f0f5;
    --muted: #5a5a72;
    --card: #14141f;
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–bg);
color: var(–text);
font-family: ‘DM Mono’, monospace;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
padding: 40px 20px;
overflow-x: hidden;
}

body::before {
content: ‘’;
position: fixed;
top: -200px; left: -200px;
width: 600px; height: 600px;
background: radial-gradient(circle, rgba(0,229,160,0.07) 0%, transparent 70%);
pointer-events: none;
z-index: 0;
}
body::after {
content: ‘’;
position: fixed;
bottom: -200px; right: -200px;
width: 600px; height: 600px;
background: radial-gradient(circle, rgba(0,94,255,0.07) 0%, transparent 70%);
pointer-events: none;
z-index: 0;
}

.wrapper {
width: 100%;
max-width: 640px;
position: relative;
z-index: 1;
}

header {
text-align: center;
margin-bottom: 40px;
}

.logo-tag {
display: inline-block;
font-size: 10px;
font-weight: 500;
letter-spacing: 3px;
text-transform: uppercase;
color: var(–accent);
border: 1px solid rgba(0,229,160,0.3);
padding: 4px 12px;
border-radius: 2px;
margin-bottom: 14px;
}

h1 {
font-family: ‘Syne’, sans-serif;
font-size: clamp(28px, 6vw, 42px);
font-weight: 800;
line-height: 1.1;
letter-spacing: -1px;
}

h1 span {
color: var(–accent);
}

.sub {
margin-top: 10px;
color: var(–muted);
font-size: 12px;
letter-spacing: 1px;
}

/* Category pills */
.categories {
display: flex;
flex-wrap: wrap;
gap: 8px;
margin-bottom: 24px;
justify-content: center;
}

.pill {
padding: 6px 14px;
border-radius: 20px;
border: 1px solid var(–border);
background: var(–card);
color: var(–muted);
font-size: 11px;
font-family: ‘DM Mono’, monospace;
letter-spacing: 1px;
cursor: pointer;
transition: all 0.2s ease;
text-transform: uppercase;
}

.pill:hover {
border-color: var(–accent);
color: var(–accent);
}

.pill.active {
background: rgba(0,229,160,0.12);
border-color: var(–accent);
color: var(–accent);
}

/* Tone selector */
.tone-row {
display: flex;
gap: 8px;
margin-bottom: 28px;
flex-wrap: wrap;
}

.tone-btn {
flex: 1;
min-width: 80px;
padding: 8px 10px;
background: var(–card);
border: 1px solid var(–border);
color: var(–muted);
font-family: ‘DM Mono’, monospace;
font-size: 11px;
letter-spacing: 1px;
cursor: pointer;
border-radius: 4px;
transition: all 0.2s;
text-transform: uppercase;
text-align: center;
}

.tone-btn:hover { border-color: #444; color: var(–text); }

.tone-btn.active {
background: rgba(0,94,255,0.12);
border-color: var(–accent2);
color: #7fa8ff;
}

/* Generate button */
.gen-btn {
width: 100%;
padding: 18px;
background: var(–accent);
border: none;
color: #000;
font-family: ‘Syne’, sans-serif;
font-size: 15px;
font-weight: 700;
letter-spacing: 2px;
text-transform: uppercase;
cursor: pointer;
border-radius: 6px;
transition: all 0.2s ease;
position: relative;
overflow: hidden;
margin-bottom: 28px;
}

.gen-btn:hover {
background: #00ffb0;
transform: translateY(-1px);
box-shadow: 0 8px 30px rgba(0,229,160,0.3);
}

.gen-btn:active { transform: translateY(0); }

.gen-btn:disabled {
background: var(–border);
color: var(–muted);
cursor: not-allowed;
transform: none;
box-shadow: none;
}

.gen-btn .spinner {
display: none;
width: 16px; height: 16px;
border: 2px solid rgba(0,0,0,0.3);
border-top-color: #000;
border-radius: 50%;
animation: spin 0.7s linear infinite;
position: absolute;
right: 20px;
top: 50%;
transform: translateY(-50%);
}

.gen-btn.loading .spinner { display: block; }

@keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

/* Tweet card */
.tweet-card {
background: var(–card);
border: 1px solid var(–border);
border-radius: 12px;
padding: 24px;
display: none;
animation: fadeUp 0.4s ease;
position: relative;
}

.tweet-card.visible { display: block; }

@keyframes fadeUp {
from { opacity: 0; transform: translateY(16px); }
to { opacity: 1; transform: translateY(0); }
}

.tweet-header {
display: flex;
align-items: center;
gap: 12px;
margin-bottom: 16px;
}

.avatar {
width: 42px; height: 42px;
border-radius: 50%;
background: linear-gradient(135deg, var(–accent), var(–accent2));
display: flex; align-items: center; justify-content: center;
font-family: ‘Syne’, sans-serif;
font-weight: 800;
font-size: 15px;
color: #000;
flex-shrink: 0;
}

.handle-info { flex: 1; }
.display-name {
font-family: ‘Syne’, sans-serif;
font-weight: 700;
font-size: 14px;
color: var(–text);
}
.handle { font-size: 12px; color: var(–muted); }

.tweet-body {
font-size: 15px;
line-height: 1.65;
color: var(–text);
white-space: pre-wrap;
word-break: break-word;
min-height: 60px;
}

.char-count {
margin-top: 14px;
font-size: 11px;
color: var(–muted);
text-align: right;
}

.char-count.over { color: #ff4d6d; }

.tweet-actions {
display: flex;
gap: 10px;
margin-top: 20px;
padding-top: 16px;
border-top: 1px solid var(–border);
}

.action-btn {
flex: 1;
padding: 10px;
background: transparent;
border: 1px solid var(–border);
color: var(–muted);
font-family: ‘DM Mono’, monospace;
font-size: 11px;
letter-spacing: 1px;
text-transform: uppercase;
cursor: pointer;
border-radius: 4px;
transition: all 0.2s;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
}

.action-btn:hover { border-color: var(–accent); color: var(–accent); }

.action-btn.copied { border-color: var(–accent); color: var(–accent); }

/* History */
.history-section {
margin-top: 36px;
}

.history-title {
font-size: 10px;
letter-spacing: 3px;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 14px;
}

.history-item {
background: var(–card);
border: 1px solid var(–border);
border-radius: 8px;
padding: 14px 16px;
margin-bottom: 10px;
font-size: 13px;
line-height: 1.5;
color: #888;
cursor: pointer;
transition: all 0.2s;
white-space: pre-wrap;
word-break: break-word;
}

.history-item:hover {
border-color: var(–border);
color: var(–text);
background: #1a1a25;
}

.error-msg {
color: #ff6b6b;
font-size: 12px;
text-align: center;
padding: 12px;
background: rgba(255,107,107,0.08);
border: 1px solid rgba(255,107,107,0.2);
border-radius: 6px;
margin-bottom: 16px;
display: none;
}

.section-label {
font-size: 10px;
letter-spacing: 2px;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 10px;
}
</style>

</head>
<body>

<div class="wrapper">

  <header>
    <div class="logo-tag">@TheFinanceGuy</div>
    <h1>Tweet <span>Generator</span></h1>
    <p class="sub">AI-powered · Live market context · Original content</p>
  </header>

  <div class="section-label">Topic</div>
  <div class="categories">
    <div class="pill active" data-cat="markets">📈 Markets</div>
    <div class="pill" data-cat="crypto">₿ Crypto</div>
    <div class="pill" data-cat="stocks">🏦 Stocks</div>
    <div class="pill" data-cat="fed">🏛 Fed / Macro</div>
    <div class="pill" data-cat="real estate">🏠 Real Estate</div>
    <div class="pill" data-cat="personal finance">💰 Personal Finance</div>
    <div class="pill" data-cat="earnings">📊 Earnings</div>
    <div class="pill" data-cat="tech stocks">💻 Big Tech</div>
  </div>

  <div class="section-label">Tone</div>
  <div class="tone-row">
    <button class="tone-btn active" data-tone="bold & contrarian">🔥 Bold</button>
    <button class="tone-btn" data-tone="educational">📚 Educational</button>
    <button class="tone-btn" data-tone="witty & punchy">😏 Witty</button>
    <button class="tone-btn" data-tone="data-driven & analytical">📊 Analytical</button>
    <button class="tone-btn" data-tone="motivational">💪 Hype</button>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <button class="gen-btn" id="genBtn" onclick="generateTweet()">
    ⚡ Generate Tweet
    <div class="spinner"></div>
  </button>

  <div class="tweet-card" id="tweetCard">
    <div class="tweet-header">
      <div class="avatar">TFG</div>
      <div class="handle-info">
        <div class="display-name">The Finance Guy</div>
        <div class="handle">@TheFinanceGuy</div>
      </div>
    </div>
    <div class="tweet-body" id="tweetBody" contenteditable="true"></div>
    <div class="char-count" id="charCount">0 / 280</div>
    <div class="tweet-actions">
      <button class="action-btn" id="copyBtn" onclick="copyTweet()">
        📋 Copy
      </button>
      <button class="action-btn" onclick="openTwitter()">
        𝕏 Post
      </button>
      <button class="action-btn" onclick="generateTweet()">
        🔄 Regenerate
      </button>
    </div>
  </div>

  <div class="history-section" id="historySection" style="display:none">
    <div class="history-title">Recent Tweets</div>
    <div id="historyList"></div>
  </div>

</div>

<script>
  let selectedCategory = 'markets';
  let selectedTone = 'bold & contrarian';
  let tweetHistory = [];

  // Category pills
  document.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      selectedCategory = p.dataset.cat;
    });
  });

  // Tone buttons
  document.querySelectorAll('.tone-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.tone-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      selectedTone = b.dataset.tone;
    });
  });

  // Char count update
  document.getElementById('tweetBody').addEventListener('input', updateCharCount);

  function updateCharCount() {
    const text = document.getElementById('tweetBody').innerText;
    const len = text.length;
    const el = document.getElementById('charCount');
    el.textContent = `${len} / 280`;
    el.className = 'char-count' + (len > 280 ? ' over' : '');
  }

  async function generateTweet() {
    const btn = document.getElementById('genBtn');
    const errorEl = document.getElementById('errorMsg');

    btn.disabled = true;
    btn.classList.add('loading');
    btn.childNodes[0].textContent = '⚡ Generating...';
    errorEl.style.display = 'none';

    const today = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    const prompt = `You are The Finance Guy, a popular finance Twitter personality known for sharp, original takes. Today is ${today}.

Generate ONE original tweet about ${selectedCategory} for Twitter. The tone must be: ${selectedTone}.

Requirements:
- Must feel timely and relevant to current ${selectedCategory} conditions as of ${today}
- Reference realistic current market context (rates, valuations, trends — be specific and credible)
- 100% original — no clichés, no "thread 🧵" bait, no cringe finance tropes
- Under 260 characters
- Include 1-2 relevant hashtags naturally (not spammy)
- No emojis unless they genuinely add punch
- No quotes around the tweet — just output the tweet text directly
- Do NOT start with "Just" or "Hot take:"

Output only the tweet text. Nothing else.`;

    try {
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer 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" },
        body: JSON.stringify({
          
          
          
          model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: prompt }]
        })
      });

      if (!response.ok) throw new Error(`API error ${response.status}`);
      const data = await response.json();

      let tweet = data.choices[0].message.content.trim();

      if (!tweet) throw new Error('No tweet generated');

      // Clean up any accidental quotes
      tweet = tweet.replace(/^["']|["']$/g, '').trim();

      displayTweet(tweet);
      addToHistory(tweet);

    } catch (err) {
      errorEl.textContent = '⚠ Could not generate tweet. Try again in a moment.';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.childNodes[0].textContent = '⚡ Generate Tweet';
    }
  }

  function displayTweet(text) {
    const card = document.getElementById('tweetCard');
    const body = document.getElementById('tweetBody');
    body.innerText = text;
    card.classList.add('visible');
    card.style.display = 'block';
    updateCharCount();
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function addToHistory(text) {
    tweetHistory.unshift(text);
    if (tweetHistory.length > 5) tweetHistory.pop();
    renderHistory();
  }

  function renderHistory() {
    const section = document.getElementById('historySection');
    const list = document.getElementById('historyList');
    if (tweetHistory.length < 2) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    list.innerHTML = tweetHistory.slice(1).map((t, i) =>
      `<div class="history-item" onclick="restoreTweet(${i + 1})">${t}</div>`
    ).join('');
  }

  function restoreTweet(index) {
    displayTweet(tweetHistory[index]);
  }

  async function copyTweet() {
    const text = document.getElementById('tweetBody').innerText;
    const btn = document.getElementById('copyBtn');
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = '✅ Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
    } catch {
      btn.textContent = '📋 Copy';
    }
  }

  function openTwitter() {
    const text = encodeURIComponent(document.getElementById('tweetBody').innerText);
    window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
  }
</script>

</body>
</html>
